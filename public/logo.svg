<svg width="260" height="272" viewBox="0 0 260 272" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Brand Blue Gradient (Tailwind blue-500 to blue-600) -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Deep Blue 3D Shadows -->
  <g transform="translate(0, 12)" fill="#1e3a8a" opacity="0.6">
    <polygon points="10,10 10,70 130,70" />
    <polygon points="10,100 10,160 190,160 250,130 190,100" />
    <polygon points="10,190 10,250 130,190" />
  </g>

  <!-- Main Glossy Polygons -->
  <g fill="url(#logoGrad)">
    <polygon points="10,10 10,70 130,70" />
    <polygon points="10,100 10,160 190,160 250,130 190,100" />
    <polygon points="10,190 10,250 130,190" />
  </g>
  
  <!-- Glassmorphism Inner Bevel Highlights -->
  <polyline points="12,68 12,14 126,68" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" fill="none" opacity="0.45" />
  <polyline points="12,158 12,102 188,102 246,130" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" fill="none" opacity="0.45" />
  <polyline points="12,248 12,192 126,192" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" fill="none" opacity="0.45" />
</svg>
