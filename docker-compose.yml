services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: synop
      POSTGRES_PASSWORD: synop
      POSTGRES_DB: synop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synop -d synop"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://synop:synop@db:5432/synop
      # Server-side AI key fallbacks — BYOK in Settings still works without these.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Required for playlist + channel watchlist fetching (free Google Cloud key).
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      # Uncomment only if you run a local LLM (e.g. Ollama) and want to reach it.
      # ALLOW_LOCAL_PROVIDERS: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
